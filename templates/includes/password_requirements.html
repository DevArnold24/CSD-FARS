<div id="password-requirements" class="password-guidance" data-password-feedback>
    <p class="password-guidance__title">Password requirements</p>
    <ul class="password-checklist">
        <li data-password-rule="length" data-label="At least 8 characters">At least 8 characters</li>
        <li data-password-rule="upper" data-label="An uppercase letter">An uppercase letter</li>
        <li data-password-rule="lower" data-label="A lowercase letter">A lowercase letter</li>
        <li data-password-rule="digit" data-label="A number">A number</li>
        <li data-password-rule="special" data-label="A special character">A special character</li>
    </ul>
    <p data-password-summary role="status" aria-live="polite" aria-atomic="true">Use a password that meets all five requirements.</p>
    <script type="application/json" data-password-policy>{{ browser_password_policy()|tojson }}</script>
</div>
<script src="{{ url_for('static', filename='js/password-feedback.js') }}" defer></script>
